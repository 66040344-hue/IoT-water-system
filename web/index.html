<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ภาพรวม · XactFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="hero-top">
        <a class="farm-pill" href="settings.html#farm" id="farmPill"></a>
        <span class="hero-date" id="today"></span>
      </div>
      <div class="hero-main">
        <div class="hero-greet" id="greet"></div>
        <div class="hero-weather" id="wxNow"></div>
      </div>
    </section>

    <h2 class="section-title">ผังระบบและสถานะอุปกรณ์</h2>
    <div class="card dg-card">
      <div id="device"></div>
      <div class="dg-scroll" tabindex="0" aria-label="ผังระบบ เลื่อนซ้ายขวาเพื่อดูทั้งหมด">
        <div id="diagram"></div>
      </div>
      <div class="dg-legend">
        <span><i class="lg-water"></i>น้ำ</span>
        <span><i class="lg-fert"></i>ปุ๋ย</span>
        <span><i class="lg-mix"></i>น้ำผสมปุ๋ย</span>
        <span><i class="lg-valve"></i>วาล์วไฟฟ้า</span>
        <span><i class="lg-manual"></i>วาล์วมือ</span>
      </div>
      <div class="device-grid" id="deviceChips"></div>
    </div>

    <h2 class="section-title">แปลงจริง</h2>
    <div class="card">
      <div id="farmMap" class="farm-map"></div>
      <div id="farmInfo" style="margin-top:10px"></div>
    </div>

    <h2 class="section-title">สภาพแวดล้อมในแปลง</h2>
    <div class="env-grid" id="env"></div>

    <h2 class="section-title">การให้น้ำและปุ๋ยวันนี้</h2>
    <div class="grid cols-2" id="todayTotals"></div>

    <div class="grid lg-cols-2" style="margin-top:22px">
      <div class="card">
        <div class="card-title">พยากรณ์อากาศ</div>
        <div id="forecast" class="muted small">กำลังโหลด…</div>
      </div>
      <div class="card">
        <div class="row between">
          <div class="card-title">รายการทำงานถัดไป</div>
          <a class="small" href="schedule.html">ตั้งเวลา</a>
        </div>
        <div class="run-list" id="upcoming"></div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/system-diagram.js"></script>
  <script src="js/farm-view.js"></script>
  <script src="js/pages/home.js"></script>
</body>

</html>
