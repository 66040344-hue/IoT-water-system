<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เข้าสู่ระบบ · XactFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth-wrap">
    <div id="brand"></div>
    <div class="notice" id="demoNote" hidden style="margin-bottom:12px">
      โหมดสาธิต: ใส่อีเมล/รหัสผ่านอะไรก็ได้ แล้วใช้รหัสอุปกรณ์ <b>DEMO-0001</b> รหัสประจำอุปกรณ์ <b>123456</b>
    </div>

    <!-- ขั้นที่ 1: บัญชีผู้ใช้ -->
    <form class="card" id="authForm" hidden>
      <div class="tabs">
        <button type="button" class="active" data-mode="in">เข้าสู่ระบบ</button>
        <button type="button" data-mode="up">สมัครสมาชิก</button>
      </div>
      <label class="field" id="nameField" hidden><span>ชื่อ</span><input id="name" autocomplete="name"></label>
      <label class="field"><span>อีเมล</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="field"><span>รหัสผ่าน</span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="notice red" id="authError" hidden style="margin-top:12px"></div>
      <button class="btn block" style="margin-top:16px" id="authSubmit">เข้าสู่ระบบ</button>
    </form>

    <!-- ขั้นที่ 2: รหัสประจำอุปกรณ์ -->
    <form class="card" id="deviceForm" hidden>
      <div class="card-title">เชื่อมต่ออุปกรณ์</div>
      <p class="muted small" style="margin-bottom:12px">กรอกรหัสอุปกรณ์และรหัสประจำอุปกรณ์ที่ได้รับมาพร้อมตู้ควบคุม เพื่อเข้าดูและสั่งงานระบบ</p>
      <div id="myDevices" style="margin-bottom:12px"></div>
      <label class="field"><span>รหัสอุปกรณ์ (Device ID)</span><input id="deviceId" placeholder="เช่น TNA-0001" autocapitalize="characters" required></label>
      <label class="field"><span>รหัสประจำอุปกรณ์</span><input id="deviceCode" type="password" autocomplete="off" required></label>
      <div class="notice red" id="deviceError" hidden style="margin-top:12px"></div>
      <button class="btn block" style="margin-top:16px">เชื่อมต่อ</button>
      <button type="button" class="btn ghost block" style="margin-top:8px" id="switchUser">เปลี่ยนบัญชีผู้ใช้</button>
    </form>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/login.js"></script>
</body>

</html>
