<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ประวัติ · XactFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="page">
    <h1 class="page-title">ประวัติการทำงาน</h1>
    <p class="page-sub">เวลาทำงาน ปริมาณน้ำ (คำนวณจากอัตราการไหลของปั๊ม × เวลา) และปริมาณปุ๋ยที่จ่ายจริงจาก flow meter</p>

    <div class="row between wrap no-print">
      <div class="tabs" id="rangeTabs" style="margin:0">
        <button data-days="1" class="active">วันนี้</button>
        <button data-days="7">7 วัน</button>
        <button data-days="30">30 วัน</button>
        <button data-days="0">กำหนดเอง</button>
      </div>
      <button class="btn ghost sm" id="exportCsv">ดาวน์โหลด CSV</button>
    </div>
    <div class="form-grid no-print" id="customRange" hidden style="margin-top:10px">
      <label class="field"><span>ตั้งแต่วันที่</span><input type="date" id="fromDate"></label>
      <label class="field"><span>ถึงวันที่</span><input type="date" id="toDate"></label>
    </div>

    <div class="grid cols-3" id="summary" style="margin-top:14px"></div>
    <div class="card" style="margin-top:12px">
      <div class="table-wrap" id="rows"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/pages/history.js"></script>
</body>

</html>
