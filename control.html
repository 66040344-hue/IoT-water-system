<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ควบคุม · XactFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="page">
    <h1 class="page-title">ควบคุมการทำงาน</h1>
    <p class="page-sub">กำหนดปริมาณน้ำและปุ๋ยของแต่ละโซน สั่งงาน และเปิด/ปิดอุปกรณ์ทั้ง 7 ตัว</p>

    <div id="alerts"></div>

    <div class="card">
      <div class="row between wrap">
        <div>
          <div class="card-title" style="margin-bottom:2px">โหมดการทำงาน</div>
          <div class="small muted" id="modeHint"></div>
        </div>
        <div class="seg" id="modeSeg">
          <button data-mode="auto">Auto</button>
          <button data-mode="manual">Manual</button>
        </div>
      </div>
    </div>

    <div class="card job-card" id="jobCard" hidden></div>

    <h2 class="section-title">ให้น้ำและปุ๋ยตามโซน</h2>
    <p class="small muted" style="margin:-4px 0 10px">ค่าที่ตั้งตรงนี้คือค่าเดียวกับในหน้าตั้งค่า &gt; โซน และตารางเวลาก็ใช้ค่าชุดนี้ สูตรปุ๋ยของแต่ละถังเปลี่ยนได้ที่ <a href="settings.html#tanks">ตั้งค่า &gt; ถังปุ๋ย</a></p>
    <div class="grid lg-cols-2" id="zoneCards"></div>

    <div class="row between" style="margin-top:22px">
      <h2 class="section-title" style="margin:0">อุปกรณ์</h2>
      <button class="btn danger sm" id="allOff">หยุดและปิดทั้งหมด</button>
    </div>
    <p class="small muted" id="relayHint" style="margin-top:6px"></p>
    <div class="grid cols-auto" id="relays" style="margin-top:10px"></div>

    <h2 class="section-title">Flow meter ปุ๋ย</h2>
    <div class="grid cols-3" id="flows"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/pages/control.js"></script>
</body>

</html>
