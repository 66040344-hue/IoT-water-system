<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06121a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ควบคุม · XactFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="page">
    <h1 class="page-title">ควบคุมการทำงาน</h1>

    <div id="alerts"></div>

    <!-- แถบสั่งการ: โหมด + สถานะ + หยุดฉุกเฉิน (ค้างอยู่บนสุดขณะเลื่อน) -->
    <div class="ctl-bar">
      <div class="seg" id="modeSeg" role="group" aria-label="โหมดการทำงาน">
        <button data-mode="auto">Auto</button>
        <button data-mode="manual">Manual</button>
      </div>
      <span class="ctl-state" id="ctlState"></span>
      <button class="btn danger" id="allOff" title="หยุดงานที่ทำอยู่และปิดอุปกรณ์ทั้งหมด">■ หยุดทั้งหมด</button>
    </div>
    <p class="small muted ctl-hint" id="modeHint"></p>

    <div class="ctl-layout">
      <div class="ctl-main">
        <div class="card job-card" id="jobCard" hidden></div>

        <div class="ctl-head">
          <h2 class="section-title">ให้น้ำและปุ๋ยตามโซน</h2>
          <p class="small muted">ค่าที่ตั้งตรงนี้เป็นค่าเดียวกับในตั้งค่า &gt; โซน และตารางเวลา สูตรปุ๋ยของแต่ละถังเปลี่ยนได้ที่ <a href="settings.html#tanks">ตั้งค่า &gt; ถังปุ๋ย</a></p>
        </div>
        <div class="ctl-zones" id="zoneCards"></div>
      </div>

      <aside class="ctl-side">
        <section class="card">
          <div class="row between">
            <h2 class="card-title" style="margin:0">อุปกรณ์</h2>
            <span class="badge soft" id="relayBadge"></span>
          </div>
          <p class="small muted" id="relayHint" style="margin:6px 0 4px"></p>
          <div class="ctl-relays" id="relays"></div>
        </section>

        <section class="card">
          <h2 class="card-title">Flow meter ปุ๋ย</h2>
          <div class="ctl-flows" id="flows"></div>
        </section>
      </aside>
    </div>
  </main>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/demo.js"></script>
  <script defer src="js/pages/control.js"></script>
</body>

</html>
